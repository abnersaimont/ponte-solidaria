<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Ponte Solidária conecta pessoas que querem doar alimentos e roupas com quem precisa.">
    <title>{% block title %}Ponte Solidária{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{{ url_for('index') }}" aria-label="Ponte Solidária - início">
                <span>Ponte Solidária</span>
            </a>

            <nav class="main-nav" aria-label="Navegação principal">
                <a href="{{ url_for('index') }}">Início</a>
                <a href="{{ url_for('listar_doacoes') }}">Doações</a>
                <a href="{{ url_for('index') }}#como-funciona">Como funciona</a>
                <a href="{{ url_for('index') }}#sobre">Sobre</a>
            </nav>

            <a class="button button-small button-primary header-action" href="{{ url_for('cadastrar_doacao') }}">Quero doar</a>
        </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer" id="contato">
        <div class="container footer-inner">
            <div class="footer-about">
                <a class="brand brand-footer" href="{{ url_for('index') }}">
                    <span>Ponte Solidária</span>
                </a>
                <p>Projeto 2º EM - E.E. Dr. Benedito Leite Ribeiro</p>
            </div>

            <address class="footer-contact">
                <strong>Contato</strong>
                <span>Rua Dom Ranulfo, 250, Centro</span>
                <span>Guaxupé - MG</span>
                <a href="tel:+5535998642685">(35) 99864-2685</a>
                <a href="mailto:pontesolidaria2026@gmail.com">pontesolidaria2026@gmail.com</a>
            </address>
        </div>
    </footer>
</body>
</html>
